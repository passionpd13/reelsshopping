[project]
name = "shopping-reels-backend"
version = "0.1.0"
description = "Shopping Reels Generator — FastAPI backend + pipeline services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "anthropic[vertex]>=0.39",
  "yt-dlp>=2024.10.7",
  "faster-whisper>=1.0.3",
  "scenedetect[opencv]>=0.6.4",
  "pillow>=10.4",
  "numpy>=1.26",
  "python-slugify>=8.0",
  "tenacity>=9.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
srg = "app.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
