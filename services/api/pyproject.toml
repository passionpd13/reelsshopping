[project]
name = "reels-search"
version = "0.1.0"
description = "Image-to-product-video search PoC for reelsshopping"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "yt-dlp>=2024.10.7",
    "Pillow>=10.3",
    "imagehash>=4.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tenacity>=9.0",
]

[project.scripts]
reels-search = "reels_search.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reels_search"]

[tool.ruff]
line-length = 100
target-version = "py311"
